name: Build & publish SaladCloud renderer (amd64)
on:
  push:
    branches: [feature/gpu-video-renderer-foundation, main]
    paths:
      - Dockerfile
      - .dockerignore
      - renderer/**
      - tests/**
      - .github/workflows/renderer-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate API contract and manifest security
        run: python -m unittest discover -s tests -v
  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable SHA tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dilshadshahsyed883-cmd/cloud-video-rendere:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check immutable image without real GPU (CPU smoke only)
        env:
          IMAGE: ghcr.io/dilshadshahsyed883-cmd/cloud-video-rendere:sha-${{ github.sha }}
        run: |
          docker run -d --name renderer-smoke -e RENDERER_API_TOKEN=0123456789abcdef0123456789abcdef -e RENDERER_ENCODER=cpu "$IMAGE"
          for i in $(seq 1 30); do
            if docker exec renderer-smoke python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=2)"; then
              echo 'CPU-only API smoke: PASS'; exit 0
            fi
            sleep 3
          done
          docker logs renderer-smoke
          exit 1
      - name: Cleanup smoke container
        if: always()
        run: docker rm -f renderer-smoke || true
